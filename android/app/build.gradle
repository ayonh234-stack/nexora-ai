plugins { id 'com.android.application' }

def nexoraUrl = (project.findProperty("nexoraUrl") ?: "").toString().trim()

android {
    namespace 'com.socialgrowthlab.nexora'
    compileSdk 34
    defaultConfig {
        applicationId "com.socialgrowthlab.nexora"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3.0"
        buildConfigField "String", "DEFAULT_URL", "\"${nexoraUrl}\""
    }
    def ks = file("../nexora-debug.keystore")
    signingConfigs {
        debug {
            // Uses the project keystore when present (kept off git); otherwise Android's default debug key.
            if (!ks.exists()) { return }
            storeFile file("../nexora-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { if (ks.exists()) signingConfig signingConfigs.debug }
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
