<!doctype html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Instagram সংযোগ গাইড — Nexora AI</title>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: "Hind Siliguri", Inter, system-ui, sans-serif; background: #fff; color: #1f1f1f; line-height: 1.65; }
  @media (prefers-color-scheme: dark) { body { background: #212121; color: #ececec; } code { background: #2f2f2f !important; } blockquote { background: #2a2a2a !important; } }
  main { max-width: 760px; margin: 0 auto; padding: 20px 18px 60px; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; } .top img { width: 32px; height: 32px; } .top a { margin-left: auto; color: #7c5cff; text-decoration: none; font-weight: 600; }
  h1 { font-size: 24px; line-height: 1.3; } h2 { font-size: 19px; margin-top: 28px; } h3 { font-size: 16px; }
  code { background: #f2f2f2; padding: 2px 6px; border-radius: 6px; font-size: 13px; word-break: break-all; }
  blockquote { margin: 12px 0; padding: 10px 14px; border-left: 4px solid #7c5cff; background: #f6f3ff; border-radius: 8px; }
  a { color: #7c5cff; } hr { border: 0; border-top: 1px solid #8884; margin: 24px 0; }
</style>
</head>
<body>
<main>
  <div class="top"><img src="/icons/icon.svg" alt="" /><b>Nexora AI</b><a href="/">← চ্যাটে ফিরুন</a></div>
  <article id="doc">লোড হচ্ছে…</article>
</main>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script>
fetch("/help/instagram-setup-bn.md", { cache: "no-store" }).then(r => r.text()).then(md => {
  document.getElementById("doc").innerHTML = DOMPurify.sanitize(marked.parse(md, { gfm: true }));
  document.querySelectorAll("#doc a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
}).catch(() => { document.getElementById("doc").textContent = "গাইড লোড করা যায়নি, আবার চেষ্টা করুন।"; });
</script>
</body>
</html>
