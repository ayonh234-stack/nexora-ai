<!doctype html>
<html lang="bn" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Nexora AI — Your AI. Your Business. Your World.</title>
  <meta name="description" content="Nexora AI is your all-in-one intelligent assistant for business, productivity, creativity and everyday life." />
  <meta name="theme-color" content="#212121" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nexora AI" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>try{var th=localStorage.getItem("nexora.theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=th;}catch(e){}</script>
  <link rel="stylesheet" href="/style.css?v=22" />
</head>
<body>
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" aria-label="Chats">
      <div class="side-top">
        <button class="side-brand" id="newChat" title="New chat">
          <img src="/icons/icon.svg" alt="" /><span>Nexora AI</span>
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" /></svg>
        </button>
        <button class="icon-btn only-mobile" id="closeSide" aria-label="Close sidebar">
          <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <label class="search">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
        <input id="search" type="search" placeholder="চ্যাট খুঁজুন" />
      </label>
      <nav class="history" id="history"></nav>
      <div class="side-foot">
        <button class="side-link" id="leadBtn">🚀 <span data-i18n="leadBtn">ফ্রি গ্রোথ কনসালটেশন</span></button>
        <button class="side-link" id="themeBtn">🌓 <span data-i18n="theme">থিম</span></button>
        <button class="side-link" id="langBtn">🌐 <span id="langLabel">English</span></button>
        <button class="side-link" id="installBtn" hidden>⬇ <span data-i18n="install">অ্যাপ ইনস্টল</span></button>
        <button class="side-link" id="serverBtn" hidden>⚙ <span data-i18n="server">সার্ভার URL</span></button>
        <button class="side-link danger" id="clearAll">🗑 <span data-i18n="clearAll">সব চ্যাট মুছুন</span></button>
        <p class="side-note">Nexora AI · SocialGrowthLab · Md Zahngir Hossain</p>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="openSide" aria-label="Open sidebar">
          <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" /></svg>
        </button>
        <div class="top-title"><span>Nexora AI</span></div>
        <button class="icon-btn" id="newChatTop" aria-label="New chat" title="New chat">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" /></svg>
        </button>
      </header>

      <section class="scroller" id="scroller">
        <div class="thread" id="thread" aria-live="polite"></div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composer" autocomplete="off">
          <div class="attach-preview" id="photoPreview" hidden>
            <img id="photoThumb" alt="" />
            <button type="button" class="chip-x" id="removePhoto" aria-label="Remove photo">✕</button>
          </div>
          <textarea id="input" rows="1" placeholder="Nexora-কে কিছু জিজ্ঞেস করুন" enterkeyhint="send"></textarea>
          <div class="composer-bar">
            <label class="tool-btn" title="Photo" aria-label="Attach photo">
              <input type="file" id="photoInput" accept="image/*" hidden />
              <svg class="ico" viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l8.6-8.6a3.7 3.7 0 015.2 5.2l-8.6 8.6a1.8 1.8 0 01-2.6-2.6l8-8" /></svg>
            </label>
            <div class="dur-toggle" id="vidDur" title="ভিডিওর দৈর্ঘ্য / Video length" role="group" aria-label="Video length">
              <button type="button" data-dur="5">5স</button>
              <button type="button" data-dur="10" class="on">10স</button>
            </div>
            <span class="rec-status" id="recStatus"></span>
            <button class="tool-btn mic" id="micBtn" type="button" title="Voice" aria-label="Record voice message">
              <svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21" /></svg>
            </button>
            <button class="send" id="sendBtn" type="submit" aria-label="Send">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </form>
        <p class="disclaimer" id="disclaimer">Nexora AI ভুল করতে পারে। গুরুত্বপূর্ণ তথ্য যাচাই করে নিন।</p>
      </div>
    </main>
  </div>

  <dialog id="leadDialog" class="sheet">
    <form method="dialog" id="leadForm">
      <h2 data-i18n="leadTitle">ফ্রি গ্রোথ কনসালটেশন</h2>
      <p class="muted" data-i18n="leadSub">তথ্য দিন, Md Zahngir Hossain নিজে যোগাযোগ করবেন।</p>
      <label><span data-i18n="fName">নাম</span><input name="name" required maxlength="120" /></label>
      <label><span data-i18n="fIg">Instagram handle</span><input name="ig_handle" required maxlength="200" placeholder="@yourbrand" /></label>
      <label><span data-i18n="fBudget">বাজেট</span><input name="budget" required maxlength="120" placeholder="$100–200 / month" /></label>
      <label><span data-i18n="fContact">যোগাযোগ (Email / WhatsApp / Telegram)</span><input name="contact" required minlength="3" maxlength="200" /></label>
      <div class="sheet-actions">
        <button type="button" class="ghost-btn" id="leadCancel" data-i18n="cancel">বাতিল</button>
        <button type="submit" class="primary-btn" id="leadSubmit" data-i18n="submit">পাঠান</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/config.js"></script>
  <script src="/app.js?v=22"></script>
</body>
</html>
